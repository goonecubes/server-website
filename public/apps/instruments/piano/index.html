<!DOCTYPE html>
<!--
	Piano sheet music, shown above the Lobby piano when a player presses Space.
	The game opens it at 450x250 (basic keys) or 600x250 with ?adv=1 (advanced keys), and its
	arrow keys call pageBack() / pageForward(). The sheets are GMod Tower's original .sht
	files in sheets/basic and sheets/advanced, listed by sheets/index.json; the page shows the
	keys to press the same way the original piano.php did. ?type=N opens song N.
	Plain ES5 and old CSS: it may run in Garry's Mod's old Awesomium browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>GMT Piano</title>
<link rel="stylesheet" href="piano.css">
</head>
<body>
<div class="music">
	<h2 id="title">&nbsp;</h2>
	<div class="notes" id="notes"></div>
</div>
<div class="mode" id="mode"></div>
<div class="key" id="key">&nbsp;</div>
<div class="back">[Left]</div>
<div class="next">[Right]</div>
<script src="piano.js"></script>
</body>
</html>
